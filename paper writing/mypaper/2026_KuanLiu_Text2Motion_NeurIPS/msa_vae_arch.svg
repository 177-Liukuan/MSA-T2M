<rect width='100%' height='100%' fill='#fffdf8'/>
<text x='900' y='60' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='34' font-weight='700' fill='#1f2937'>MSA-VAE: Multi-Scale Semantic Alignment VAE</text><text x='900' y='96' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='400' fill='#5b6472'>Dual-track design: physical reconstruction via causal CNN-VAE and semantic structuring via Transformer AE</text><rect x='70' y='150' width='220' height='520' rx='20' ry='20' fill='#d9ecff' stroke='#253247' stroke-width='3'/><text x='180' y='235' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2937'><tspan x='180' dy='0'>Input motion</tspan><tspan x='180' dy='37.800000000000004'>X ∈ R^{T×272}</tspan></text><text x='180' y='315' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='400' fill='#5b6472'><tspan x='180' dy='0'>MS-272 pose stream</tspan><tspan x='180' dy='29.700000000000003'>root velocity + 22-joint</tspan><tspan x='180' dy='29.700000000000003'>positions / velocities / 6D rotations</tspan></text><rect x='110' y='420' width='140' height='44' rx='22.0' ry='22.0' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='180.0' y='449.3333333333333' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='600' fill='#1f2937'>window T=64</text><rect x='105' y='480' width='150' height='44' rx='22.0' ry='22.0' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='180.0' y='509.3333333333333' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='600' fill='#1f2937'>causal input</text><text x='180' y='575' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='400' fill='#5b6472'><tspan x='180' dy='0'>HumanML3D motion</tspan><tspan x='180' dy='29.700000000000003'>with optional padding mask</tspan></text><rect x='360' y='150' width='340' height='520' rx='20' ry='20' fill='#bfe3ff' stroke='#253247' stroke-width='3'/><text x='530' y='220' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1f2937'><tspan x='530' dy='0'>Causal CNN-VAE</tspan><tspan x='530' dy='40.5'>(physical branch)</tspan></text><rect x='400' y='270' width='260' height='90' rx='20' ry='20' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='530' y='318' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='530' dy='0'>Causal Encoder</tspan><tspan x='530' dy='31.05'>2× temporal downsampling</tspan></text><rect x='400' y='385' width='260' height='88' rx='20' ry='20' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='530' y='432' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='530' dy='0'>Posterior params</tspan><tspan x='530' dy='31.05'>μ, logσ² ∈ R^{T′×16}</tspan></text><rect x='400' y='498' width='260' height='86' rx='20' ry='20' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='530' y='545' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='530' dy='0'>Reparameterization</tspan><tspan x='530' dy='31.05'>z_local = μ + ε ⊙ σ</tspan></text><text x='530' y='625' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='400' fill='#5b6472'>T′ = T / 4</text><rect x='770' y='150' width='360' height='520' rx='20' ry='20' fill='#d9f4d8' stroke='#253247' stroke-width='3'/><text x='950' y='220' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1f2937'><tspan x='950' dy='0'>Semantic Autoencoder</tspan><tspan x='950' dy='40.5'>(semantic branch)</tspan></text><rect x='810' y='270' width='280' height='90' rx='20' ry='20' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='950' y='318' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='950' dy='0'>Transformer Encoder</tspan><tspan x='950' dy='31.05'>[CLS] prepended to μ</tspan></text><rect x='810' y='385' width='280' height='88' rx='20' ry='20' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='950' y='432' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='950' dy='0'>Global feature</tspan><tspan x='950' dy='31.05'>h_cls ∈ R^{768}</tspan></text><rect x='810' y='498' width='280' height='86' rx='20' ry='20' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='950' y='545' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='950' dy='0'>Transformer Decoder</tspan><tspan x='950' dy='31.05'>reconstruct μ̂ from h_cls</tspan></text><text x='950' y='625' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='400' fill='#5b6472'>semantic branch uses deterministic μ, not noisy z_local</text><rect x='1200' y='150' width='260' height='520' rx='20' ry='20' fill='#f9d2d2' stroke='#253247' stroke-width='3'/><text x='1330' y='220' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1f2937'><tspan x='1330' dy='0'>Alignment Heads</tspan></text><rect x='1240' y='285' width='180' height='86' rx='20' ry='20' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='1330' y='332' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='1330' dy='0'>global_proj</tspan><tspan x='1330' dy='31.05'>h_cls → [CLS]</tspan></text><rect x='1240' y='420' width='180' height='86' rx='20' ry='20' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='1330' y='467' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='1330' dy='0'>local_proj</tspan><tspan x='1330' dy='31.05'>μ_i → l_i</tspan></text><text x='1330' y='585' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='400' fill='#5b6472'><tspan x='1330' dy='0'>project to text</tspan><tspan x='1330' dy='29.700000000000003'>embedding space</tspan><tspan x='1330' dy='29.700000000000003'>(T5-XXL: 768D)</tspan></text><rect x='360' y='725' width='340' height='180' rx='20' ry='20' fill='#bfe3ff' stroke='#253247' stroke-width='3'/><text x='530' y='790' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1f2937'><tspan x='530' dy='0'>Causal Decoder</tspan><tspan x='530' dy='40.5'>z_local → X̂</tspan></text><text x='530' y='855' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='21' font-weight='400' fill='#5b6472'><tspan x='530' dy='0'>reconstructs motion from noisy local latents</tspan><tspan x='530' dy='28.35'>preserves temporal causality and physical detail</tspan></text><rect x='770' y='725' width='360' height='180' rx='20' ry='20' fill='#f3e8ff' stroke='#253247' stroke-width='3'/><text x='950' y='780' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1f2937'><tspan x='950' dy='0'>Semantic reconstruction</tspan><tspan x='950' dy='40.5'>μ̂_{1:T′}</tspan></text><text x='950' y='845' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='21' font-weight='400' fill='#5b6472'><tspan x='950' dy='0'>decoded only from h_cls</tspan><tspan x='950' dy='28.35'>forces [CLS] to be generatively complete</tspan></text><rect x='1200' y='725' width='520' height='180' rx='20' ry='20' fill='#eef2ff' stroke='#253247' stroke-width='3'/><text x='1460' y='775' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1f2937'><tspan x='1460' dy='0'>Training objectives</tspan></text><text x='1460' y='830' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='23' font-weight='600' fill='#1f2937'><tspan x='1460' dy='0'>L_total = L_recon + L_KL + λ_root L_root + λ_latent L_latent</tspan><tspan x='1460' dy='31.05'>+ λ_global L_global + λ_local L_local</tspan></text><text x='1460' y='885' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='21' font-weight='400' fill='#5b6472'><tspan x='1460' dy='0'>L_global: [CLS] ↔ caption target</tspan><tspan x='1460' dy='28.35'>L_local: μ_i ↔ BABEL frame-label text</tspan></text><line x1='290' y1='410' x2='360' y2='410' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='700' y1='315' x2='810' y2='315' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='700' y1='430' x2='810' y2='430' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='700' y1='540' x2='770' y2='540' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='530' y1='584' x2='530' y2='725' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='950' y1='584' x2='950' y2='725' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='1090' y1='430' x2='1240' y2='328' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='700' y1='430' x2='1240' y2='463' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='530' y1='473' x2='530' y2='498' stroke='#253247' stroke-width='4' stroke-linecap='round' stroke-dasharray='8 8' marker-end='url(#arrow)'/><text x='600' y='492' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='400' fill='#5b6472'>sampled branch</text><text x='710' y='350' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='400' fill='#5b6472'>deterministic μ</text><text x='760' y='505' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='700' fill='#253247'>dual-track decoupling</text><line x1='700' y1='815' x2='770' y2='815' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><line x1='1130' y1='815' x2='1200' y2='815' stroke='#253247' stroke-width='4' stroke-linecap='round' marker-end='url(#arrow)'/><text x='735' y='800' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='400' fill='#5b6472'>μ̂</text><text x='1165' y='800' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='400' fill='#5b6472'>losses</text><rect x='1480' y='150' width='240' height='240' rx='18' ry='18' fill='#ffffff' stroke='#253247' stroke-width='2'/><text x='1600' y='195' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#1f2937'><tspan x='1600' dy='0'>Key design choices</tspan></text><text x='1600' y='245' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#5b6472'><tspan x='1600' dy='0'>1. CNN branch models</tspan><tspan x='1600' dy='25.650000000000002'>causal physical dynamics</tspan></text><text x='1600' y='305' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#5b6472'><tspan x='1600' dy='0'>2. Transformer branch</tspan><tspan x='1600' dy='25.650000000000002'>aggregates sequence semantics</tspan></text><text x='1600' y='365' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#5b6472'><tspan x='1600' dy='0'>3. [CLS] becomes the</tspan><tspan x='1600' dy='25.650000000000002'>retrieval key for RAG</tspan></text></svg>